name: Build MiaoTV image

on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: 'Publish the verified image to GHCR'
        required: false
        default: false
        type: boolean
      tag:
        description: 'Additional image tag'
        required: false
        default: ''
        type: string
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/test-requirements.txt
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated storage test dependencies
        run: python -m pip install -r scripts/test-requirements.txt
      - name: Check types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Run regression and storage tests
        env:
          MIAOTV_REDIS_LUA_TESTS: '1'
        run: pnpm test
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - name: Determine image and release policy
        id: policy
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          INPUT_PUBLISH: ${{ inputs.publish_image }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          # Match metadata-action's sanitization for all consumers of the version tag.
          echo "image_tag=$(node -p "require('./package.json').version.replace(/[^a-zA-Z0-9._-]+/g, '-')")" >> "$GITHUB_OUTPUT"
          if [[ "$(node scripts/public-release-policy.cjs)" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - name: Registry login
        if: steps.policy.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.policy.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.policy.outputs.image_tag }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
          labels: |
            org.opencontainers.image.version=${{ steps.policy.outputs.version }}
      - name: Build amd64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container startup, authentication and SQLite persistence
        timeout-minutes: 5
        env:
          SMOKE_IMAGE: ${{ steps.policy.outputs.image }}:${{ steps.policy.outputs.image_tag }}
          SMOKE_STORAGE_ISOLATED: 'true'
          SMOKE_STORAGE_FIXTURE_ID: release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export SMOKE_USERNAME=release-smoke
          SMOKE_PASSWORD="$(openssl rand -hex 24)"
          export SMOKE_PASSWORD
          echo "::add-mask::$SMOKE_PASSWORD"
          cleanup_smoke() {
            smoke_exit=$?
            trap - EXIT
            if (( smoke_exit != 0 )); then
              printf 'Container verification failed with exit code %s\n' "$smoke_exit"
              docker inspect --format 'Container state: {{json .State}}' miaotv-release-smoke || true
            fi
            docker logs --tail 200 miaotv-release-smoke || true
            docker rm -f miaotv-release-smoke >/dev/null || true
            exit "$smoke_exit"
          }
          trap cleanup_smoke EXIT
          docker run --detach --name miaotv-release-smoke \
            --publish 127.0.0.1::3000 \
            --env USERNAME="$SMOKE_USERNAME" --env PASSWORD="$SMOKE_PASSWORD" \
            --env NEXT_PUBLIC_STORAGE_TYPE=sqlite --env NEXT_PUBLIC_SITE_NAME=MiaoTV \
            --env DISABLE_HERO_TRAILER=true \
            "$SMOKE_IMAGE"
          smoke_address="$(docker port miaotv-release-smoke 3000/tcp)"
          export SMOKE_ORIGIN="http://${smoke_address}"
          SMOKE_STORAGE_MODE=seed node scripts/verify-container.mjs
          docker restart --time 10 miaotv-release-smoke
          smoke_address="$(docker port miaotv-release-smoke 3000/tcp)"
          export SMOKE_ORIGIN="http://${smoke_address}"
          SMOKE_STORAGE_MODE=verify node scripts/verify-container.mjs
      - name: Publish verified image and save digest
        if: steps.policy.outputs.publish == 'true'
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          VERSIONED_IMAGE: ${{ steps.policy.outputs.image }}:${{ steps.policy.outputs.image_tag }}
        run: |
          set -euo pipefail
          while IFS= read -r image_tag; do
            if [[ -n "$image_tag" ]]; then docker push "$image_tag"; fi
          done <<< "$IMAGE_TAGS"
          published_image=$(docker image inspect "$VERSIONED_IMAGE" --format '{{index .RepoDigests 0}}')
          printf '%s\n' "${published_image##*@}" > image-digest.txt
      - name: Upload published digest
        if: steps.policy.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-linux-amd64
          path: image-digest.txt
          if-no-files-found: error
